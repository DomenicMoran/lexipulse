name: EAS Build

# Store builds are expensive and rate-limited, so they never run on a push.
# Tag a release (v1.0.0) or start the workflow by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: production

jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/mobile
        run: >-
          eas build
          --platform ${{ inputs.platform || 'all' }}
          --profile ${{ inputs.profile || 'production' }}
          --non-interactive
          --no-wait
